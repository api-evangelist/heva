aid: heva
name: heva
description: >-
  heva is an AI-native healthcare and medical-tourism platform that connects patients with
  vetted medical practices, specialists, and providers across borders, with an initial focus
  on Spanish-speaking markets. The platform offers practice discovery by specialty and
  location, deposit-based online appointment booking, a conversational AI booking assistant
  (Heva AI), an online store for purchasing procedures and services, and secure payments via
  Stripe. Provider-facing tools cover practice management, patient acquisition,
  communications, and appointment coordination, delivered through the web and native iOS and
  Android provider apps. heva is a Techstars-backed company building "care without borders."
